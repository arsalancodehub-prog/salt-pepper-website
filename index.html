<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snp Main</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- navbar started -->

    <header>
        <div id="navbar" class="navbar-container">
            <div class="logo">
                <img class="logo-img" src="./assests/images/images-Photoroom.png" alt="image">
            </div>

            <div class="navbar">
                <nav class="nav-items">
                    <a href="home.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="publication.html">Publications</a>
                    <button class="franchise-btn">Get a Franchise</button>
                    <button class="order-btn">Order Online <span class="btn-icon"><i
                                class="fa-solid fa-circle-arrow-right"
                                style="color: rgb(255, 255, 255);"></i></i></span></button>
                </nav>
            </div>

            <!-- mobile menu started  -->

            <div class="mobile-navbar">
                <div class="mobile-icon">
                    <i class="fa-solid fa-bars"></i>
                </div>
                <div id="logo">
                    <img src="./assests/images/images-Photoroom.png" alt="image">
                </div>

                <div class="mobile-btn">
                    <button class="order-btn">Order Online <span class="btn-icon"><i
                                class="fa-solid fa-circle-arrow-right"
                                style="color: rgb(255, 255, 255);"></i></i></span></button>
                </div>

            </div>

            <!-- mobile menu ended -->

        </div>
    </header>

    <!-- navbar ended -->

    <!-- wellcom e container started -->

    <main>
        <div class="main-container">

            <div class="carousel">
                <img class="carousel-img" src="./assests/images/fa51cb9a-526f-409c-a8dd-1a30f322fc26.webp"
                    alt="carousel image">
            </div>

            <div class="wellcome-heading">Welcome to
                <span class="futurak-word">Salt'n Pepper</span> <br>
                Restaurants! Our Brands
            </div>

            <div class="wellcome-para">Please click our brands below for further information, reservations or to order
                online!</div>

            <div class="brand-parent">

                <div class="brand-children"><img class="brand-img" src="./assests/images/brand 1.webp"
                        alt="brand-image">
                    <button class="brand-ord-btn">Order Now</button>
                </div>

                <div class="brand-children"><img class="brand-img" src="./assests/images/brand 2.webp"
                        alt="brand-image">
                    <button class="brand-ord-btn">Order Now</button>
                </div>

                <div class="brand-children"><img class="brand-img" src="./assests/images/brand 3.webp"
                        alt="brand-image">
                    <button class="brand-ord-btn">Order Now</button>
                </div>

                <div class="brand-children"><img class="brand-img" src="./assests/images/brand 4.webp"
                        alt="brand-image">
                    <button class="brand-ord-btn">Order Now</button>
                </div>

            </div>

    </main>
    <footer></footer>
</body>

</html>
